<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verbos 200</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Layout idea: one narrow working column (practice card) under a sticky header that carries the countdown. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#14213a; --muted:#5a667b; --line:#d9dfe9;
  --accent:#1f4fd8; --accent-soft:#e5ebfb; --on-accent:#ffffff;
  --mark:#8a6100; --mark-soft:#ffefc2;
  --good:#17784a; --good-soft:#def3e7; --bad:#bd3327; --bad-soft:#fbe4e1;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-verb:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1420; --surface:#182031; --ink:#e8ecf4; --muted:#9aa6ba; --line:#2b3549;
    --accent:#86a7ff; --accent-soft:#202c4a; --on-accent:#0f1420;
    --mark:#ffd35c; --mark-soft:#43360f;
    --good:#5fd39c; --good-soft:#143524; --bad:#ff8f80; --bad-soft:#44201c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1420; --surface:#182031; --ink:#e8ecf4; --muted:#9aa6ba; --line:#2b3549;
  --accent:#86a7ff; --accent-soft:#202c4a; --on-accent:#0f1420;
  --mark:#ffd35c; --mark-soft:#43360f;
  --good:#5fd39c; --good-soft:#143524; --bad:#ff8f80; --bad-soft:#44201c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;padding:12px 0 8px}
.brand{font-family:var(--font-verb);font-size:22px;font-weight:700;letter-spacing:.01em}
.brand span{color:var(--accent)}
.count{margin-left:auto;display:flex;align-items:baseline;gap:8px}
.count b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums;font-weight:800}
.count small{color:var(--muted);font-size:13px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
nav{display:flex;gap:4px;padding:8px 0 0;overflow-x:auto}
nav a{padding:8px 14px;border-radius:10px 10px 0 0;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main.wrap{padding:20px 16px 64px}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.rev{background:var(--mark-soft);color:var(--mark)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:650}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:14px}

/* practice */
.qhead{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.qhead>div{min-width:0}
.qhead .btn{flex:none}
.tense{margin-bottom:-6px}
.tense .chip{font-size:15px;padding:4px 12px}
.verb{font-family:var(--font-verb);font-size:34px;font-weight:700;line-height:1.15}
.mean{font-size:16px}
.mean em{font-style:normal;color:var(--muted)}
.prompt{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:4px}
.pron{font-family:var(--font-verb);font-size:26px;min-width:0}
.answer{flex:1 1 220px;min-width:0;font-family:var(--font-verb);font-size:26px;padding:8px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
.answer:focus{border-color:var(--accent);outline:none}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.keys button{min-width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-family:var(--font-verb);font-size:19px}
.keys button:hover{border-color:var(--accent)}
.pips{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted)}
.pipline{display:flex;gap:5px}
.pip{width:22px;height:8px;border-radius:4px;background:var(--line)}
.pip.on{background:var(--good)}
.fb{border-radius:10px;padding:14px 16px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb .big{font-family:var(--font-verb);font-size:26px;font-weight:700}
.fb.ok .big{color:var(--good)}
.fb.no .big{color:var(--bad)}
.fb s{color:var(--muted)}
.banner{background:var(--good-soft);color:var(--good);border-radius:10px;padding:10px 14px;font-weight:650}
.warn{background:var(--mark-soft);color:var(--mark);border-radius:10px;padding:10px 14px;font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* tables */
.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tt{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tt h4{margin:0;padding:7px 12px;font-size:13px;background:var(--accent-soft);color:var(--accent);display:flex;justify-content:space-between;gap:8px}
.tt h4 span{font-weight:500;color:var(--muted)}
.tt table{width:100%;border-collapse:collapse;font-size:15px}
.tt td{padding:4px 12px;border-top:1px solid var(--line)}
.tt td:first-child{color:var(--muted);font-size:13px;width:50%;white-space:nowrap}
.tt td:last-child{font-family:var(--font-verb);font-size:17px}
.tt tr.hi td{background:var(--accent-soft)}
mark{background:var(--mark-soft);color:inherit;border-radius:4px;padding:0 3px}
/* flashcards */
.fc{width:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;cursor:pointer;color:inherit}
.fc:hover{border-color:var(--accent)}
.fc .verb{font-size:46px}
.fcmean{font-family:var(--font-verb);font-size:30px;font-weight:700;line-height:1.2}
.fcmean small{display:block;font-family:var(--font-body);font-size:17px;font-weight:400;color:var(--muted);margin-top:8px}
.fcback{min-height:300px}
.kf td:first-child{width:42%}
.kf td small{color:var(--muted);margin-left:4px}
/* example sentence */
.ex{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.ex span{display:block;font-family:var(--font-verb);font-size:18px}
.ex small{color:var(--muted);font-size:14px}
ul.notes{margin:0;padding-left:20px;font-size:15px}
.legend{font-size:13px;color:var(--muted)}

/* verb list */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:34px minmax(0,1fr) 84px;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.vrow:hover{border-color:var(--accent)}
.vrow .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.vrow .v{font-family:var(--font-verb);font-size:19px;font-weight:700}
.vrow .m{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow .st{justify-self:end;text-align:right;font-size:12px;color:var(--muted)}
.mini{height:5px;width:80px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--good)}
.detail{border:1px solid var(--accent);border-radius:10px;padding:16px;background:var(--surface)}

/* grammar */
.prose{max-width:66ch}
.prose h2{font-family:var(--font-verb);font-size:26px;margin:28px 0 8px}
.prose h2:first-child{margin-top:0}
.prose h3{font-size:17px;margin:18px 0 6px}
.prose p{margin:8px 0}
.prose .es{font-family:var(--font-verb);font-size:17px}
.gt{overflow-x:auto;margin:10px 0}
.gt table{border-collapse:collapse;font-size:15px;min-width:100%}
.gt th,.gt td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.gt th{background:var(--accent-soft);color:var(--accent);font-size:13px}
.gt td.es,.gt td .es{font-family:var(--font-verb);font-size:16.5px}
.gbar{position:sticky;top:var(--hh,110px);z-index:4;display:flex;gap:10px;align-items:center;background:var(--surface);margin:-20px -20px 12px;padding:10px 20px;border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.toc{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{white-space:nowrap;text-decoration:none;flex:none}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
.gbar .seg{flex:none;flex-wrap:nowrap}
.prose h2{scroll-margin-top:calc(var(--hh,110px) + 64px)}

/* options */
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin:0;background:var(--surface)}
legend{font-weight:700;padding:0 6px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
label.opt input{margin-top:5px}
label.opt small{display:block;color:var(--muted)}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
@media (max-width:600px){
  header{position:static}
}
@media (max-width:480px){
  .verb{font-size:28px}.count b{font-size:26px}.card{padding:16px}
  .vrow{grid-template-columns:28px minmax(0,1fr) 64px}.mini{width:60px}
  .gbar{margin:-16px -16px 12px;padding:8px 16px}
  .tense{gap:6px}.tense .chip{font-size:13px;padding:3px 9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Verbos <span>200</span></div>

    <nav aria-label="Sections">

      <a href="#grammar" data-tab="grammar">Grammar</a>
      <a href="#options" data-tab="options">Options</a>
    </nav>
  </div>
</header>
<main class="wrap"><div id="view"></div></main>

/* ---------- header ---------- */
function header(){
  const left = leftCount();
  document.getElementById('left').textContent = left;
  document.getElementById('bar').style.width = ((VERBS.length-left)/VERBS.length*100)+'%';
}

/* ---------- practice ---------- */
let endless = false;
let Q = null, phase = 'ask', qn = 0, retry = [], lastInf = '', flash = '';
function bumpDay(ok){
  const d = today(); if(S.day.d !== d) S.day = {d, n:0, ok:0};
  S.day.n++; S.tot.n++; if(ok){ S.day.ok++; S.tot.ok++; }
}
function choose(){
  qn++;
  // 1. a missed form comes back a few questions later
  const ri = retry.findIndex(r=>r.due <= qn && !mastered(BY[r.inf]) && S.s.tenses.includes(r.t) && (S.s.vos || r.p !== 4));
  if(ri >= 0 && (retry[ri].inf !== lastInf || pool().length < 2)){
    const r = retry.splice(ri,1)[0]; return mk(BY[r.inf], r.t, r.p, false);
  }
  // 2. optional refresher of a mastered verb
  if(Math.random() < 0.1){
    const done = VERBS.filter(mastered);
    if(done.length) return mk(pick(done), pick(tenses()), pick(persons()), true);
  }
  // 3. a verb from the active set
  const pl = pool();
  if(!pl.length){
    const done = VERBS.filter(mastered);
    return done.length && endless ? mk(pick(done), pick(tenses()), pick(persons()), true) : null;
  }
  const cand = pl.length > 1 ? pl.filter(v=>v.inf !== lastInf) : pl;
  const v = pick(cand);
  const open = tenses().filter(t=>sum(v.inf,t) < TARGET);
  const t = pick(open);
  const c = counts(v.inf,t), ps = persons();
  const min = Math.min(...ps.map(p=>c[p]));
  const p = pick(ps.filter(p=>c[p] === min));
  return mk(v,t,p,false);
}
function mk(v,t,p,review){ return {v,t,p,review,pron:pick(PRON[p])}; }
function next(){
  Q = choose();
  if(!Q){ phase = 'done'; }
  else { lastInf = Q.v.inf; phase = (!Q.review && !started(Q.v)) ? 'intro' : 'ask'; }
  renderPractice();
}
function answer(text, gaveUp){
  const v = Q.v, right = form(v,Q.t,Q.p);
  const a = norm(text), r = right.toLowerCase();
  let ok = a === r, accentOnly = false;
  if(!ok && !gaveUp && a && strip(a) === strip(r)){ accentOnly = true; ok = !S.s.strict; }
  const was = mastered(v);
  if(!Q.review){
    const c = counts(v.inf,Q.t);
    if(ok) c[Q.p]++;
    else { c[Q.p] = Math.max(0, c[Q.p]-1); retry.push({inf:v.inf, t:Q.t, p:Q.p, due:qn+3+rnd(3)}); }
  }
  bumpDay(ok);
  flash = (!was && mastered(v)) ? v.inf : '';
  Q.res = {ok, accentOnly, given:text.trim(), gaveUp};
  phase = 'fb'; save(); header(); renderPractice();
}
function pipsHTML(v, hiT){
  return '<div class="pips">'+tenses().map(t=>{
    const s = sum(v.inf,t);
    return '<span>'+(t===hiT?'<b>':'')+T[t].name+(t===hiT?'</b>':'')+'</span><span class="pipline" role="img" aria-label="'+s+' of '+TARGET+' correct">'+
      Array.from({length:TARGET},(_,i)=>'<i class="pip'+(i<s?' on':'')+'"></i>').join('')+'</span>';
  }).join('')+'</div>';
}
function tableHTML(v,t,hi){
  return '<div class="tt"><h4>'+T[t].name+'<span>'+T[t].cue+'</span></h4><table>'+
    [0,1,2,3,4,5].map(p=>'<tr'+(p===hi?' class="hi"':'')+'><td>'+PLABEL[p]+'</td><td>'+formHTML(v,t,p)+'</td></tr>').join('')+'</table></div>';
}
function exHTML(v){ return '<div class="ex"><span>'+esc(v.ex)+'</span><small>'+esc(v.exen)+'</small></div>'; }
function notesHTML(v){ return '<ul class="notes">'+v.notes.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>'; }
function statsHTML(){
  const d = S.day.d === today() ? S.day : {n:0, ok:0};
  const acc = d.n ? Math.round(d.ok/d.n*100)+'% correct' : 'no answers yet';
  const learning = VERBS.filter(v=>started(v) && !mastered(v)).length;
  return '<div class="stats"><span>Today: <b>'+d.n+'</b> answers, '+acc+'</span><span>In progress: <b>'+learning+'</b> verbs</span><span>Mastered: <b>'+(VERBS.length-leftCount())+'</b></span></div>';
}
function renderPractice(){
  const el = document.getElementById('view');
  let h = '<div class="stack">';
  if(!storageOK) h += '<div class="warn">This browser view is not saving progress. Copy a backup code under Options before you close it.</div>';
  if(!tenses().length){
    h += '<div class="card">No tense is switched on. Choose at least one under <a href="#options">Options</a>.</div></div>';
    el.innerHTML = h; return;
  }
  if(phase === 'done'){
    h += '<div class="card stack"><div class="verb">¡Enhorabuena!</div><p>All 200 verbs are mastered in the tenses you selected. Keep them fresh with refresher questions, or switch on another tense under <a href="#options">Options</a>.</p><div class="row"><button class="btn primary" id="more">Refresh mastered verbs</button></div></div>'+statsHTML()+'</div>';
    el.innerHTML = h; document.getElementById('more').onclick = ()=>{ endless = true; next(); }; return;
  }
  const v = Q.v;
  if(phase === 'intro'){
    h += '<div class="card stack"><div class="qhead"><span class="chip">New verb</span><span class="muted small">No. '+(v.i+1)+' of 200</span></div>'+
      '<div><div class="verb">'+esc(v.inf)+'</div><div class="mean">'+esc(v.en)+' <em>· '+esc(v.hu)+'</em></div></div>'+exHTML(v)+
      notesHTML(v)+'<div class="tables">'+tenses().map(t=>tableHTML(v,t,-1)).join('')+'</div>'+
      '<div class="legend"><mark>Highlighted</mark> forms do not follow the regular pattern.</div>'+
      '<div class="row"><button class="btn primary" id="go">Start practising</button><span class="muted small">or press Enter</span></div></div>';
    el.innerHTML = h+statsHTML()+'</div>';
    document.getElementById('go').onclick = ()=>{ prog(v.inf).seen = 1; save(); phase = 'ask'; renderPractice(); };
    document.getElementById('go').focus();
    return;
  }
  h += '<div class="card stack">'+
    '<div class="qhead"><div><div class="verb">'+esc(v.inf)+'</div><div class="mean">'+esc(v.en)+' <em>· '+esc(v.hu)+'</em></div></div>'+
    '<button class="btn ghost sm" id="peek" type="button">Verb card</button></div>'+
    '<div class="row tense"><span class="chip">'+T[Q.t].name+'</span><span class="chip plain">'+T[Q.t].cue+'</span>'+(Q.review?'<span class="chip rev">Refresher</span>':'')+'</div>';
  if(phase === 'ask'){
    h += '<form id="f" class="stack" autocomplete="off"><div class="prompt"><label class="pron" for="ans">'+Q.pron+'</label>'+
      '<input class="answer" id="ans" name="ans" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="'+(v.refl?'pronoun + verb':'type the form')+'"></div>'+
      (showKeys() ? '<div class="keys" aria-label="Accented letters">'+['á','é','í','ó','ú','ü','ñ'].map(k=>'<button type="button" data-k="'+k+'" tabindex="-1">'+k+'</button>').join('')+'</div>' : '')+
      '<div class="row"><button class="btn primary" type="submit">Check</button><button class="btn ghost" type="button" id="idk">I don\'t know</button></div></form>';
  } else {
    const r = Q.res, right = form(v,Q.t,Q.p);
    if(r.ok){
      h += '<div class="fb ok" role="status"><div class="big">'+Q.pron+' '+esc(right)+'</div>'+
        (r.accentOnly ? '<div class="small">Counted as correct, but check the accent: you typed “'+esc(r.given)+'”.</div>' : '<div class="small">Correct.</div>')+'</div>';
    } else {
      h += '<div class="fb no" role="status">'+(r.given ? '<div><s>'+esc(r.given)+'</s></div>' : '')+
        '<div class="big">'+Q.pron+' '+esc(right)+'</div>'+
        '<div class="small">'+(r.accentOnly ? 'Only the written accent is off. It matters: hablo = I speak, habló = he spoke.' : 'This form will come back in a few questions.')+'</div></div>'+
        tableHTML(v,Q.t,Q.p);
    }
    h += exHTML(v);
    if(flash) h += '<div class="banner">'+esc(flash)+' is mastered. '+leftCount()+' verbs left.</div>';
    h += '<div class="row"><button class="btn primary" id="nx">Next</button><span class="muted small">or press Enter</span></div>';
  }
  if(!Q.review) h += pipsHTML(v,Q.t);
  h += '<div id="peekbox"></div></div>'+statsHTML()+'</div>';
  el.innerHTML = h;
  document.getElementById('peek').onclick = ()=>{
    const b = document.getElementById('peekbox');
    b.innerHTML = b.innerHTML ? '' : '<div class="stack">'+notesHTML(v)+(phase==='fb' ? '<div class="tables">'+tenses().map(t=>tableHTML(v,t,-1)).join('')+'</div>' : '<div class="legend">The full tables appear after you answer.</div>')+'</div>';
  };
  if(phase === 'ask'){
    const inp = document.getElementById('ans');
    document.getElementById('f').onsubmit = e=>{ e.preventDefault(); if(inp.value.trim()) answer(inp.value,false); else inp.focus(); };
    document.getElementById('idk').onclick = ()=>answer('',true);
    el.querySelectorAll('.keys button').forEach(b=>{
      b.onmousedown = e=>e.preventDefault();
      b.onclick = ()=>{ const s=inp.selectionStart ?? inp.value.length, e2=inp.selectionEnd ?? s; inp.value = inp.value.slice(0,s)+b.dataset.k+inp.value.slice(e2); inp.focus(); inp.setSelectionRange(s+1,s+1); };
    });
    inp.focus();
  } else {
    document.getElementById('nx').onclick = next;
    document.getElementById('nx').focus();
  }
}

/* ---------- flashcards ---------- */
let flipped = false;
function shuffled(){ const a = VERBS.map(v=>v.i); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function cards(){
  const c = S.cards;
  if(!c || !Array.isArray(c.deck) || c.deck.some(i=>!VERBS[i])) S.cards = {dir:(c && c.dir) || 'es', deck:shuffled(), n:0};
  return S.cards;
}
function keyRow(label, v, t, ps){
  return '<tr><td>'+label+'</td><td>'+ps.map(p=>formHTML(v,t,p)).join(', ')+'</td></tr>';
}
function keyFormsHTML(v){
  const regular = !/1/.test(v.irr) && !v.ppIrr;
  return '<div class="tt kf"><h4>Key forms<span>'+(regular ? 'regular -'+v.inf.replace(/se$/,'').slice(-2).replace('í','i')+' verb' : 'highlighted = irregular')+'</span></h4><table>'+
    keyRow('Presente <small>yo</small>', v, 'pres', [0])+
    keyRow('Indefinido <small>yo, él</small>', v, 'indef', [0,2])+
    keyRow('Perfecto <small>yo</small>', v, 'perf', [0])+
    keyRow('Futuro <small>yo</small>', v, 'fut', [0])+'</table></div>';
}
function renderCards(){
  const el = document.getElementById('view'), c = cards(), total = VERBS.length;
  const done = Math.min(c.n, total);
  let h = '<div class="stack"><div class="tools"><div class="seg" role="group" aria-label="Card direction">'+
    '<button data-d="es" aria-pressed="'+(c.dir==='es')+'">Spanish first</button><button data-d="mean" aria-pressed="'+(c.dir==='mean')+'">Meaning first</button></div>'+
    '<span class="muted small" style="margin-left:auto">'+done+' of '+total+' done</span><button class="btn sm ghost" id="fc-shuffle">Reshuffle</button></div>'+
    '<div class="bar" aria-hidden="true"><i style="width:'+(done/total*100)+'%"></i></div>';
  if(!c.deck.length){
    h += '<div class="card stack"><div class="verb">Deck finished</div><p style="margin:0">You have been through all 200 cards. Shuffle them for another round.</p><div class="row"><button class="btn primary" id="fc-again">Shuffle and start again</button></div></div></div>';
    el.innerHTML = h; bind(); return;
  }
  const v = VERBS[c.deck[0]];
  const mean = '<div class="mean">'+esc(v.en)+' <em>· '+esc(v.hu)+'</em></div>';
  if(!flipped){
    h += '<button class="card fc" id="fc-flip">'+(c.dir==='es' ? '<span class="verb">'+esc(v.inf)+'</span>' : '<span class="fcmean">'+esc(v.en)+'<small>'+esc(v.hu)+'</small></span>')+
      '<span class="muted small">'+(c.dir==='es' ? 'What does it mean? What are its key forms?' : 'Which Spanish verb is it?')+'<br>Tap to turn the card</span></button>';
  } else {
    h += '<div class="card stack fcback" id="fc-back"><div><div class="verb">'+esc(v.inf)+'</div>'+mean+'</div>'+keyFormsHTML(v)+exHTML(v)+
      '<div class="row"><button class="btn primary" id="fc-next">Next card</button><button class="btn" id="fc-again1">Not yet, show it again soon</button>'+
      '<a class="btn ghost sm" href="#verbs" id="fc-all">All forms</a></div></div>';
  }
  h += '<p class="muted small" style="margin:0">Cards are for getting to know the verbs. They do not change the countdown. That comes from typing the forms in Practice.</p></div>';
  el.innerHTML = h; bind();
  function bind(){
    el.querySelectorAll('[data-d]').forEach(b=>b.onclick = ()=>{ c.dir = b.dataset.d; flipped = false; save(); renderCards(); });
    const on = (id,fn)=>{ const b = document.getElementById(id); if(b) b.onclick = fn; };
    const fresh = ()=>{ S.cards = {dir:c.dir, deck:shuffled(), n:0}; flipped = false; save(); renderCards(); };
    on('fc-shuffle', fresh); on('fc-again', fresh);
    on('fc-flip', ()=>{ flipped = true; renderCards(); });
    on('fc-next', e=>{ e.stopPropagation(); c.deck.shift(); c.n++; flipped = false; save(); renderCards(); });
    on('fc-again1', e=>{ e.stopPropagation(); const i = c.deck.shift(); c.deck.splice(Math.min(c.deck.length, 4+rnd(4)), 0, i); flipped = false; save(); renderCards(); });
    on('fc-all', e=>{ e.stopPropagation(); openInf = VERBS[c.deck[0]].inf; filter = 'all'; query = ''; });
    const f = document.getElementById('fc-flip') || document.getElementById('fc-next'); if(f) f.focus({preventScroll:true});
  }
}

/* ---------- verb list ---------- */
let filter = 'all', query = '', openInf = '';
function status(v){ return mastered(v) ? 'mastered' : started(v) ? 'learning' : 'new'; }
function detailHTML(v){
  const p = S.p[v.inf] || {};
  return '<div class="detail stack"><div><div class="verb">'+esc(v.inf)+'</div><div class="mean">'+esc(v.en)+' <em>· '+esc(v.hu)+'</em></div></div>'+exHTML(v)+notesHTML(v)+
    '<div class="tables">'+TORDER.map(t=>tableHTML(v,t,-1)).join('')+'</div>'+
    '<div class="legend"><mark>Highlighted</mark> forms do not follow the regular pattern.</div>'+
    '<div class="row"><button class="btn sm" data-act="known">'+(p.k?'Put back into practice':'I already know this verb')+'</button>'+
    '<button class="btn sm danger" data-act="reset">Reset this verb</button><button class="btn sm ghost" data-act="close">Close</button></div></div>';
}
function listHTML(){
  const q = strip(query.trim().toLowerCase());
  const need = tenses().length*TARGET || 1;
  return VERBS.filter(v=>{
    if(filter !== 'all' && status(v) !== filter) return false;
    return !q || strip(v.inf).includes(q) || v.en.toLowerCase().includes(q) || strip(v.hu.toLowerCase()).includes(q);
  }).map(v=>{
    if(v.inf === openInf) return detailHTML(v);
    const st = status(v), got = st==='mastered' ? need : tenses().reduce((a,t)=>a+sum(v.inf,t),0);
    return '<button class="vrow" data-inf="'+esc(v.inf)+'"><span class="n">'+(v.i+1)+'</span><span><span class="v">'+esc(v.inf)+'</span><span class="m">'+esc(v.en)+' · '+esc(v.hu)+'</span></span>'+
      '<span class="st">'+st+'<span class="mini"><i style="width:'+(got/need*100)+'%"></i></span></span></button>';
  }).join('') || '<p class="muted">No verbs match.</p>';
}
function renderVerbs(){
  const el = document.getElementById('view');
  const n = {all:VERBS.length, new:0, learning:0, mastered:0}; VERBS.forEach(v=>n[status(v)]++);
  el.innerHTML = '<div class="stack"><div class="tools"><input class="search" id="q" type="search" placeholder="Search in Spanish, English or Hungarian" aria-label="Search verbs" value="'+esc(query)+'">'+
    '<div class="seg">'+['all','new','learning','mastered'].map(f=>'<button data-f="'+f+'" aria-pressed="'+(filter===f)+'">'+f[0].toUpperCase()+f.slice(1)+' '+n[f]+'</button>').join('')+'</div></div>'+
    '<p class="muted small" style="margin:0">Verbs 1 to 111 follow corpus frequency rankings. 112 to 200 are common everyday verbs chosen for life in Spain. Tap a verb for all its forms.</p>'+
    '<div class="vlist" id="vl">'+listHTML()+'</div></div>';
  const vl = document.getElementById('vl');
  const od = vl.querySelector('.detail'); if(od) setTimeout(()=>od.scrollIntoView({block:'center'}),0);
  document.getElementById('q').oninput = e=>{ query = e.target.value; vl.innerHTML = listHTML(); };
  el.querySelectorAll('.seg button').forEach(b=>b.onclick = ()=>{ filter = b.dataset.f; renderVerbs(); });
  vl.onclick = e=>{
    const row = e.target.closest('.vrow'); if(row){ openInf = row.dataset.inf; vl.innerHTML = listHTML(); const d = vl.querySelector('.detail'); if(d) d.scrollIntoView({block:'nearest'}); return; }
    const act = e.target.closest('[data-act]'); if(!act) return;
    const a = act.dataset.act, p = prog(openInf);
    if(a === 'known'){ if(p.k) delete p.k; else { p.k = 1; p.seen = 1; } }
    if(a === 'reset'){ delete S.p[openInf]; }
    if(a === 'close'){ openInf = ''; }
    save(); header(); if(Q && !Q.review && mastered(Q.v)) Q = null; renderVerbs();
  };
}

/* ---------- grammar ---------- */
const GRAMMAR = `
<div class="prose">
<h2>The basics in one minute</h2>
<p>Every Spanish verb ends in <b>-ar</b>, <b>-er</b> or <b>-ir</b>. Take that ending off and you have the stem: <span class="es">habl-ar, com-er, viv-ir</span>. A tense is a set of six endings, one per person. In Spain all six are in daily use, including <span class="es">vosotros</span> (you, plural and informal).</p>
<div class="gt"><table><tr><th>Presente</th><th>hablar</th><th>comer</th><th>vivir</th></tr>
<tr><td>yo</td><td class="es">habl<b>o</b></td><td class="es">com<b>o</b></td><td class="es">viv<b>o</b></td></tr>
<tr><td>tú</td><td class="es">habl<b>as</b></td><td class="es">com<b>es</b></td><td class="es">viv<b>es</b></td></tr>
<tr><td>él, ella, usted</td><td class="es">habl<b>a</b></td><td class="es">com<b>e</b></td><td class="es">viv<b>e</b></td></tr>
<tr><td>nosotros</td><td class="es">habl<b>amos</b></td><td class="es">com<b>emos</b></td><td class="es">viv<b>imos</b></td></tr>
<tr><td>vosotros</td><td class="es">habl<b>áis</b></td><td class="es">com<b>éis</b></td><td class="es">viv<b>ís</b></td></tr>
<tr><td>ellos, ellas, ustedes</td><td class="es">habl<b>an</b></td><td class="es">com<b>en</b></td><td class="es">viv<b>en</b></td></tr></table></div>
<p>Many common verbs change their stem vowel in the present when the stress falls on it, so in every person except nosotros and vosotros: <span class="es">pensar → pienso, poder → puedo, pedir → pido</span>.</p>

<h2 id="g-past">The three past tenses</h2>
<p>English mostly gets by with “I spoke”. Spanish in Spain splits the past three ways, and the time expression usually tells you which one to use.</p>
<div class="gt"><table><tr><th>Tense</th><th>Use it for</th><th>Typical signals</th><th>Example</th></tr>
<tr><td><b>Pretérito perfecto</b><br><span class="es">he hablado</span></td><td>Something finished, in a period that is still running</td><td class="es">hoy, esta mañana, esta semana, este año, ya, todavía no, alguna vez, nunca</td><td class="es">Hoy he comido paella.</td></tr>
<tr><td><b>Pretérito indefinido</b><br><span class="es">hablé</span></td><td>Something finished, in a period that is over</td><td class="es">ayer, anoche, el lunes, la semana pasada, en 2019, hace dos años</td><td class="es">Ayer comí paella.</td></tr>
<tr><td><b>Pretérito imperfecto</b><br><span class="es">hablaba</span></td><td>Habits, descriptions and background in the past</td><td class="es">antes, de niño, siempre, todos los días, mientras</td><td class="es">De niño comía paella los domingos.</td></tr></table></div>
<p>The perfecto for “today” and “this week” is typical of Spain. In most of Latin America people say <span class="es">hoy comí</span>. In Spain <span class="es">hoy he comido</span> is the normal choice.</p>

<h2 id="g-perf">Pretérito perfecto: he hablado</h2>
<p>Two words: the present of <b>haber</b> plus the participle. The participle never changes.</p>
<div class="gt"><table><tr><th>haber</th><th>+ participle</th></tr>
<tr><td class="es">he, has, ha, hemos, habéis, han</td><td><span class="es">-ar → -ado</span> (hablado) · <span class="es">-er, -ir → -ido</span> (comido, vivido)</td></tr></table></div>
<p>Nothing goes between the two words: <span class="es">No he comido. Ya lo he visto.</span></p>
<h3>Irregular participles in this course</h3>
<p class="es">hacer → hecho · decir → dicho · ver → visto · poner → puesto · volver → vuelto · escribir → escrito · abrir → abierto · romper → roto · morir → muerto · descubrir → descubierto · devolver → devuelto · suponer → supuesto</p>
<p>After a, e or o the ending takes an accent: <span class="es">leído, creído, caído, traído, oído, reído</span>.</p>

<h2 id="g-indef">Pretérito indefinido: hablé</h2>
<div class="gt"><table><tr><th></th><th>-ar (hablar)</th><th>-er and -ir (comer, vivir)</th></tr>
<tr><td>yo</td><td class="es">habl<b>é</b></td><td class="es">com<b>í</b></td></tr>
<tr><td>tú</td><td class="es">habl<b>aste</b></td><td class="es">com<b>iste</b></td></tr>
<tr><td>él, ella, usted</td><td class="es">habl<b>ó</b></td><td class="es">com<b>ió</b></td></tr>
<tr><td>nosotros</td><td class="es">habl<b>amos</b></td><td class="es">com<b>imos</b></td></tr>
<tr><td>vosotros</td><td class="es">habl<b>asteis</b></td><td class="es">com<b>isteis</b></td></tr>
<tr><td>ellos, ellas, ustedes</td><td class="es">habl<b>aron</b></td><td class="es">com<b>ieron</b></td></tr></table></div>

  const need = tenses().length*TARGET, todo = VERBS.filter(v=>!mastered(v)).reduce((a,v)=>a+tenses().reduce((x,t)=>x+TARGET-sum(v.inf,t),0),0);
  el.innerHTML = '<div class="stack">'+(msg?'<div class="banner">'+esc(msg)+'</div>':'')+
  '<div class="card small"><b>How it works.</b> A verb counts as mastered when you have '+TARGET+' correct answers in each tense you practise. The '+TARGET+' answers are spread over the persons, so each person comes up once. A wrong answer takes one point back and the form returns a few questions later. About one question in ten is a refresher of a verb you have already mastered. Refreshers never change the counter. With the current choices that is '+need+' correct answers per verb, and about <b>'+todo+'</b> correct answers until the counter reaches zero.</div>'+
  '<fieldset><legend>Tenses to practise</legend>'+TORDER.map(t=>'<label class="opt"><input type="checkbox" data-t="'+t+'" id="t-'+t+'"'+(s.tenses.includes(t)?' checked':'')+'><span>'+T[t].name+' <small>'+T[t].en+' · '+T[t].cue+'</small></span></label>').join('')+
  '<p class="muted small" style="margin:6px 0 0">Changing this recalculates the counter. Progress in every tense is kept.</p></fieldset>'+
  '<fieldset><legend>Practice</legend>'+
  '<label class="opt"><input type="checkbox" id="o-vos"'+(s.vos?' checked':'')+'><span>Include vosotros <small>Used every day in Spain. Leave it on.</small></span></label>'+
  '<label class="opt"><input type="checkbox" id="o-strict"'+(s.strict?' checked':'')+'><span>Written accents must be right <small>Off: a missing accent is flagged but counted as correct.</small></span></label>'+
  '<label class="opt"><input type="checkbox" id="o-keys"'+(showKeys()?' checked':'')+'><span>Show accent buttons (á é í ó ú ü ñ) <small>Switch off if your keyboard types them. Off by default on phones.</small></span></label>'+
  '<div class="row" style="padding:6px 0"><label for="o-pool">Verbs in rotation at once</label><select id="o-pool">'+[5,8,12,20,200].map(n=>'<option value="'+n+'"'+(s.pool===n?' selected':'')+'>'+(n===200?'All 200':n)+'</option>').join('')+'</select></div>'+
  '<div class="row" style="padding:6px 0"><label for="o-order">New verbs arrive</label><select id="o-order"><option value="freq"'+(s.order==='freq'?' selected':'')+'>Most frequent first</option><option value="random"'+(s.order==='random'?' selected':'')+'>In random order</option></select></div>'+
  '</fieldset>'+
  '<fieldset><legend>Backup</legend><p class="small muted" style="margin:0 0 8px">Progress is stored in this browser only. Copy the code to move it to another device or keep it safe, and paste a code here to restore.</p>'+
  '<textarea id="bk" aria-label="Backup code" spellcheck="false"></textarea><div class="row" style="margin-top:8px"><button class="btn sm" id="b-exp">Show my backup code</button><button class="btn sm" id="b-copy">Copy</button><button class="btn sm" id="b-imp">Restore from pasted code</button></div></fieldset>'+
  '<fieldset><legend>Start over</legend><button class="btn sm danger" id="b-reset">'+(armed?'Click again to erase all progress':'Erase all progress')+'</button></fieldset></div>';
  el.querySelectorAll('[data-t]').forEach(c=>c.onchange = ()=>{ s.tenses = TORDER.filter(t=>document.getElementById('t-'+t).checked); done(); });
  document.getElementById('o-vos').onchange = e=>{ s.vos = e.target.checked; done(); };
  document.getElementById('o-keys').onchange = e=>{ s.keys = e.target.checked; done(); };
  document.getElementById('o-strict').onchange = e=>{ s.strict = e.target.checked; done(); };
  document.getElementById('o-pool').onchange = e=>{ s.pool = +e.target.value; done(); };
  document.getElementById('o-order').onchange = e=>{ s.order = e.target.value; done(); };
  const bk = document.getElementById('bk');
  document.getElementById('b-exp').onclick = ()=>{ bk.value = JSON.stringify(S); bk.select(); };
  document.getElementById('b-copy').onclick = async()=>{ if(!bk.value) bk.value = JSON.stringify(S); bk.select(); try{ await navigator.clipboard.writeText(bk.value); renderOptions('Backup code copied.'); }catch(e){ renderOptions('Copy was blocked. Select the code and copy it by hand.'); } };
  document.getElementById('b-imp').onclick = ()=>{ try{ const o = JSON.parse(bk.value); if(!o || !o.p || !o.s) throw 0; S = merge(o); Q = null; retry = []; save(); header(); renderOptions('Progress restored.'); }catch(e){ renderOptions('That is not a valid backup code. Paste the whole code, from { to }.'); } };
  document.getElementById('b-reset').onclick = ()=>{ if(!armed){ armed = true; renderOptions(); return; } armed = false; S = {s:{...S.s}, p:{}, cards:null, order:null, day:{d:'',n:0,ok:0}, tot:{n:0,ok:0}}; Q = null; retry = []; save(); header(); renderOptions('All progress erased.'); };
  function done(){ Q = null; save(); header(); renderOptions(); }
}

/* ---------- routing ---------- */
const TABS = ['practice','cards','verbs','grammar','options'];
let tab = 'practice';
function route(){
  const h = location.hash.slice(1);
  if(h.startsWith('g-')){
    if(tab !== 'grammar'){ tab = 'grammar'; show(); }
    const t = document.getElementById(h); if(t) t.scrollIntoView();
    return;
  }
  tab = TABS.includes(h) ? h : 'practice'; show(); window.scrollTo(0,0);
}
function show(){
  document.querySelectorAll('nav a').forEach(a=>{ if(a.dataset.tab === tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  armed = false;
  if(tab === 'practice'){ if(!Q || phase === 'done' || (!Q.review && mastered(Q.v) && phase !== 'fb')) next(); else renderPractice(); }
  else if(tab === 'cards') renderCards();
  else if(tab === 'verbs') renderVerbs();
  else if(tab === 'grammar') renderGrammar();
  else renderOptions();
}
document.addEventListener('keydown', e=>{
  if(e.key !== 'Enter' || tab !== 'practice') return;
  if(e.target && (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'A')) return;
  const b = document.getElementById('nx') || document.getElementById('go'); if(b){ e.preventDefault(); b.click(); }
});
window.addEventListener('hashchange', route);
load(); header(); setHH(); route();
</script>

if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
</script>
